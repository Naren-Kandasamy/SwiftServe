name: Preview on PR

on:
  pull_request:
    branches:
      - deploy/web-distribution-assets

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create .env file
        run: echo "${{ secrets.DASHBOARD_ENV }}" > dashboard/.env

      - name: Build all apps
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWIFTSERVE_18547 }}
          projectId: swiftserve-18547
          # no channelId = auto preview URL posted as PR comment